[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.2.0"
description = "PatchPilot: a repository-aware, test-validated AI agent for Python library migrations (portfolio project)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Compatible ranges here; exact resolved versions live in requirements*.lock.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13",
    "tree-sitter>=0.25,<0.26",  # 0.26.0 segfaults on some real code (tests/fixtures)
    "tree-sitter-python>=0.25",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["hypothesis", "mypy", "pip-audit", "pytest", "pytest-cov", "ruff"]
bench = ["bump-pydantic"]  # the rule-based baseline in the benchmark

[project.scripts]
patchpilot = "patchpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchpilot = ["profiles/*/guides/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient nudges toward httpx2; irrelevant to these tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "docker: needs a running Docker daemon and the sandbox images (patchpilot sandbox build)",
]

[tool.coverage.run]
source = ["patchpilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["benchmarks/tasks", "benchmarks/.llm-cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
